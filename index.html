<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hook Man Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            text-align: center;
        }

        canvas {
            background-color: #16213e;
            border: 4px solid #0f3460;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .ui-panel {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            width: 800px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .instructions {
            margin-top: 10px;
            color: #e94560;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-panel">
            <span id="score-display">Score: 0</span>
            <span id="status-display">Click and hold to hook!</span>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="instructions">Click and hold the left mouse button near a peg to attach your grappler and swing!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const statusDisplay = document.getElementById('status-display');

        // Game State
        let score = 0;
        let gameOver = false;

        // Player (Hook Man)
        const player = {
            x: 100,
            y: 250,
            radius: 12,
            vx: 3,
            vy: 0,
            gravity: 0.25,
            friction: 0.995
        };

        // Grapple Hook
        const hook = {
            active: false,
            targetPeg: null,
            length: 0
        };

        // Anchor Pegs
        const pegs = [];
        const pegDistance = 150;

        function initPegs() {
            pegs.length = 0;
            for (let x = 150; x < 2000; x += pegDistance) {
                pegs.push({
                    x: x,
                    y: 80 + Math.random() * 120,
                    radius: 8
                });
            }
        }

        initPegs();

        // Mouse Controls
        let isMouseDown = false;
        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            updateMousePos(e);
            if (!hook.active && !gameOver) {
                tryAttachHook();
            }
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
            hook.active = false;
            hook.targetPeg = null;
        });

        window.addEventListener('mousemove', updateMousePos);

        function updateMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        }

        function tryAttachHook() {
            let closestPeg = null;
            let minDistance = 200; // Max hook range

            for (let peg of pegs) {
                const dx = peg.x - player.x;
                const dy = peg.y - player.y;
                const dist = Math.hypot(dx, dy);

                if (dist < minDistance) {
                    minDistance = dist;
                    closestPeg = peg;
                }
            }

            if (closestPeg) {
                hook.active = true;
                hook.targetPeg = closestPeg;
                hook.length = minDistance;
            }
        }

        function resetGame() {
            player.x = 100;
            player.y = 250;
            player.vx = 3;
            player.vy = 0;
            score = 0;
            gameOver = false;
            hook.active = false;
            hook.targetPeg = null;
            initPegs();
            statusDisplay.textContent = "Click and hold to hook!";
        }

        function update() {
            if (gameOver) return;

            // Apply Physics
            if (hook.active && hook.targetPeg) {
                // Hook Swinging Physics
                const dx = player.x - hook.targetPeg.x;
                const dy = player.y - hook.targetPeg.y;
                const currentDist = Math.hypot(dx, dy);

                // Tension force pulling player towards target peg
                if (currentDist > hook.length) {
                    const angle = Math.atan2(dy, dx);
                    const targetX = hook.targetPeg.x + Math.cos(angle) * hook.length;
                    const targetY = hook.targetPeg.y + Math.sin(angle) * hook.length;

                    player.vx += (targetX - player.x) * 0.1;
                    player.vy += (targetY - player.y) * 0.1;
                }

                player.vy += player.gravity * 0.5; // Reduced gravity while hooked
            } else {
                // Free Fall Physics
                player.vy += player.gravity;
            }

            // Air resistance
            player.vx *= player.friction;
            player.vy *= player.friction;

            // Move player
            player.x += player.vx;
            player.y += player.vy;

            // Camera Tracking (Scroll screen horizontally)
            const cameraOffset = player.x - 200;

            // Generate new pegs as player moves forward
            const lastPeg = pegs[pegs.length - 1];
            if (lastPeg.x - cameraOffset < canvas.width + 100) {
                pegs.push({
                    x: lastPeg.x + pegDistance + (Math.random() * 40 - 20),
                    y: 80 + Math.random() * 120,
                    radius: 8
                });
            }

            // Update Score
            score = Math.max(score, Math.floor(player.x / 10) - 10);
            scoreDisplay.textContent = `Score: ${score}`;

            // Check Game Over Conditions
            if (player.y > canvas.height + 50 || player.y < -200) {
                gameOver = true;
                statusDisplay.textContent = "Game Over! Click anywhere to restart.";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cameraOffset = player.x - 200;

            ctx.save();
            ctx.translate(-cameraOffset, 0);

            // Draw Hook Line
            if (hook.active && hook.targetPeg) {
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(hook.targetPeg.x, hook.targetPeg.y);
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Draw Pegs
            for (let peg of pegs) {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
                ctx.fillStyle = (hook.targetPeg === peg) ? '#e94560' : '#00fff5';
                ctx.fill();
                ctx.closePath();
            }

            // Draw Player (Hook Man)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff2e63';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.closePath();

            // Draw Hook hand detail
            ctx.beginPath();
            ctx.arc(player.x + 8, player.y - 4, 4, 0, Math.PI);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();

            // Handle Restart on Click
            if (gameOver && isMouseDown) {
                resetGame();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
